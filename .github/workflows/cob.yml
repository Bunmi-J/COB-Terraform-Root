
name: 'Terraform'

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  cob-plan:
    name: 'Terraform-Root'
    runs-on: ubuntu-latest
    environment: dev

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      

    # Setup AWS environment and configure the AWS credentials
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
         role-to-assume: arn:aws:iam::469935552963:role/cob-terraform-github-actions
         aws-region: ${{ secrets.AWS_REGION }} 

    - name: Verify AWS identity
      run: aws sts get-caller-identity        

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      run: terraform init

    # Checks that all Terraform configuration files adhere to a canonical format
    - name: Terraform Format
      run: terraform fmt -check

   # Checks that all Terraform configuration files are validated
    - name: Terraform Validate
      run: terraform validate

    # Generates an execution plan for Terraform
    - name: Terraform Plan
      run: terraform plan -input=false -out=cobplan
      

    - name: Upload Plan Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cobplan
        path: cobplan

            
       
  terraform-apply:
   name: "Terraform Apply"
   needs: cob-plan
   runs-on: ubuntu-latest
   environment: prod   # requires approval

   steps:
     - name: Checkout
       uses: actions/checkout@v4

     - name: Setup Terraform
       uses: hashicorp/setup-terraform@v3

     - name: Configure AWS Credentials
       uses: aws-actions/configure-aws-credentials@v4
       with:
          role-to-assume: arn:aws:iam::469935552963:role/cob-terraform-github-actions
          aws-region: ${{ secrets.AWS_REGION }}
    
     - name: Verify AWS identity
       run: aws sts get-caller-identity

     - name: Terraform Init
       run: terraform init   

     - name: Download Plan Artifact
       uses: actions/download-artifact@v4
       with:
          name: cobplan
      
     - name: Terraform Apply
       #if: github.ref == 'refs/heads/main' && github.event_name == 'push'
       run: terraform apply cobplan
       #run: terraform apply -auto-approve cobplan
